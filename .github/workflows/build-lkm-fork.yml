# 本分支自有的 LKM 构建触发器。上游的 .github/workflows/build-lkm.yml / ddk-lkm.yml 保持原样不动，
# 这里只做两件上游没有的事：(1) 复用上游的 KMI 矩阵工作流构建全部 8 个 KMI，(2) 把产物提交回仓库
# 的 ci/lkm 分支（只读/MCP 客户端拿不到 Actions 产物，只能把文件提交进仓库再取回）。
#
# 身份常量不在参数里传：kernel/Kbuild 已把项目私钥（0x342 / ca40af…）与包名 me.weishu.kernelsu.hide
# 写成默认值，因此上游工作流里的 `make` 直接产出正确身份；需要别的身份时用 `make KSU_*=…` 覆盖。
#
# KMI 列表来自上游 build-lkm.yml 的矩阵（android12-5.10 … android17-6.18，共 8 个），每个 KMI 都会
# 同时产出 aarch64 与 x86_64 两个模块（ddk-lkm.yml 的两个上传步骤），与上游 release 的分发布局一致。
name: Build fork LKM (upstream KMI matrix)

on:
  push:
    branches:
      - master
      - ci-lkm-identity
    paths:
      - 'kernel/**'
      - '.github/workflows/build-lkm-fork.yml'
  workflow_dispatch:

jobs:
  build:
    uses: ./.github/workflows/build-lkm.yml

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Download aarch64 modules
        uses: actions/download-artifact@v8
        with:
          pattern: aarch64-*-lkm
          path: ci-out/aarch64
      - name: Download x86_64 modules
        uses: actions/download-artifact@v8
        with:
          pattern: x86_64-*-lkm
          path: ci-out/x86_64
      - name: Publish to ci/lkm branch
        run: |
          set -eux
          mkdir -p ci-artifacts/aarch64 ci-artifacts/x86_64
          find ci-out/aarch64 -type f -name '*_kernelsu.ko' -exec cp {} ci-artifacts/aarch64/ \;
          find ci-out/x86_64  -type f -name '*_kernelsu.ko' -exec cp {} ci-artifacts/x86_64/ \;
          ls -la ci-artifacts/aarch64 ci-artifacts/x86_64
          sha256sum ci-artifacts/aarch64/* ci-artifacts/x86_64/*
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git checkout -b ci/lkm
          git add -f ci-artifacts
          git commit -m "ci: build the upstream KMI matrix from source (Kbuild identity)"
          git push --force origin ci/lkm
