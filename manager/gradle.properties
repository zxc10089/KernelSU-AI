# Manager applicationId: this build installs side by side with the official
# me.weishu.kernelsu manager. Keep in sync with userspace/ksud KSU_PACKAGE_NAME if
# the daemon is ever rebuilt (userspace/ksud/build.rs).
KSU_PACKAGE_NAME=me.weishu.kernelsu.hide

# This tree is a snapshot of upstream main (no upstream git history), while the
# bundled native payload (jniLibs/<abi>/libksud.so) comes from the v3.3.0
# release. Pin the version identity to that release line so the manager does not
# report itself as an outdated build.
KSU_VERSION_CODE=32601
KSU_VERSION_NAME=v3.3.0+main

android.experimental.enableNewResourceShrinker.preciseShrinking=true
android.enableAppCompileTimeRClass=true
android.useAndroidX=true
android.suppressUnsupportedCompileSdk=37.0
org.gradle.jvmargs=-Xmx2048m
org.gradle.parallel=true
org.gradle.tooling.parallel=true
org.gradle.vfs.watch=true
android.r8.maxWorkers=4
android.native.buildOutput=verbose
