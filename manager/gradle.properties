# Manager applicationId: this build installs side by side with the official
# me.weishu.kernelsu manager. Keep in sync with userspace/ksud KSU_PACKAGE_NAME if
# the daemon is ever rebuilt (userspace/ksud/build.rs).
KSU_PACKAGE_NAME=me.weishu.kernelsu.hide

# Since 2026-10-16 this tree carries the real upstream history (merge commit
# 4d824711 aligning the source to upstream v3.3.1; see docs/upstream-alignment.md
# §8), but the bundled native payload (jniLibs/<abi>/libksud.so and the 16
# userspace/ksud/bin/**/*_kernelsu.ko assets) is still built from the v3.3.0 /
# 32601 line. Keep KSU_VERSION_CODE pinned to 32601 until those assets are rebuilt
# from source, otherwise _tools/verify-identity.ps1 fails its version gate; the
# matching kernel driver version is compiled from this same file (kernel/Kbuild).
# Upstream v3.3.1's own release versionCode is 32680.
KSU_VERSION_CODE=32601
KSU_VERSION_NAME=v3.3.1+main

android.experimental.enableNewResourceShrinker.preciseShrinking=true
android.enableAppCompileTimeRClass=true
android.useAndroidX=true
org.gradle.jvmargs=-Xmx2048m
org.gradle.parallel=true
org.gradle.tooling.parallel=true
org.gradle.vfs.watch=true
android.r8.maxWorkers=4
android.native.buildOutput=verbose
